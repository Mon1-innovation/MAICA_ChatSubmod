name: Release on Push or Manual Dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install test dependencies
      run: python -m pip install pytest

    - name: Run project tests
      run: python -m pytest tests -q

    - name: Extract build configuration from api.rpy
      id: get_version
      run: |
        api_path="game/Submods/MAICA_ChatSubmod/api.rpy"
        version=$(sed -nE "s/^[[:space:]]*maica_ver[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"][[:space:]]*$/\1/p" "$api_path")
        development=$(sed -nE "s/^[[:space:]]*maica_is_dev[[:space:]]*=[[:space:]]*(True|False)[[:space:]]*$/\1/p" "$api_path")
        if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
          echo "Expected exactly one maica_ver assignment" >&2
          exit 1
        fi
        if [ "$development" != "True" ] && [ "$development" != "False" ]; then
          echo "maica_is_dev must be assigned exactly once to True or False" >&2
          exit 1
        fi
        echo "Extracted version: $version"
        echo "Development build: $development"
        echo "version=$version" >> $GITHUB_OUTPUT
        if [ "$development" = "True" ]; then
          echo "is_development=true" >> $GITHUB_OUTPUT
        else
          echo "is_development=false" >> $GITHUB_OUTPUT
        fi

    - name: Check if release exists
      id: check_release
      if: steps.get_version.outputs.is_development == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "${{ steps.get_version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "Release already exists"
          echo "create_release=false" >> $GITHUB_OUTPUT
        else
          echo "Release does not exist"
          echo "create_release=true" >> $GITHUB_OUTPUT
        fi

    - name: Create release version file
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        echo "${{ steps.get_version.outputs.version }}" > game/python-packages/maica_release_version

    - name: Download Ignore Translation Conflicts dependency
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        dependency_tmp_dir="$(mktemp -d)"
        dependency_archive="$dependency_tmp_dir/dependency.zip"
        dependency_extracted="$dependency_tmp_dir/extracted"
        dependency_url="https://github.com/MAS-Submod-MoyuTeam/MAS_ignore_tl_conficts_submod/archive/refs/tags/v1.0.0.zip"
        trap 'rm -rf "$dependency_tmp_dir"' EXIT

        curl --fail --show-error --location --retry 3 "$dependency_url" --output "$dependency_archive"
        mkdir -p "$dependency_extracted"
        unzip -q "$dependency_archive" -d "$dependency_extracted"

        dependency_source="$(find "$dependency_extracted" -type d -path '*/game/Submods/IgnoreTranslationConflicts' -print -quit)"
        if [ -z "$dependency_source" ]; then
          echo "Expected Ignore Translation Conflicts directory was not found in the dependency archive" >&2
          exit 1
        fi
        if [ ! -f "$dependency_source/zz_ignore_translation_conflicts.rpy" ]; then
          echo "Expected Ignore Translation Conflicts script was not found in the dependency archive" >&2
          exit 1
        fi

        mkdir -p game/Submods
        cp -R "$dependency_source" game/Submods/

    - name: Copy documentation into submod package
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        cp README.md README_EN.md LICENSE game/Submods/MAICA_ChatSubmod/

    - name: Create zip package
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        zip -r MAICA_ChatSubmod-${{ steps.get_version.outputs.version }}.zip \
          characters \
          game \
          lib

    - name: Generate Release Notes
      id: generate_release_notes
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      run: |
        # Extract release notes from the latest commit message or a predefined template
        release_notes=$(git log -1 --pretty=%B)
        # Convert release notes to GitHub Flavored Markdown
        echo "$release_notes" | sed 's/^/- /' > release_notes.md
        # Prepend version information
        echo "## MAICA ChatSubmod ${{ steps.get_version.outputs.version }}" | cat - release_notes.md > temp && mv temp release_notes.md
        echo "RELEASE_NOTES_PATH=release_notes.md" >> $GITHUB_OUTPUT

    - name: Create Release
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        body_path: ${{ steps.generate_release_notes.outputs.RELEASE_NOTES_PATH }}
        files: |
          MAICA_ChatSubmod-${{ steps.get_version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Skip release if already exists
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'false'
      run: |
        echo "Release ${{ steps.get_version.outputs.version }} already exists. Skipping release creation."

    - name: Skip development build
      if: steps.get_version.outputs.is_development == 'true'
      run: |
        echo "Development build ${{ steps.get_version.outputs.version }} is not eligible for release."

    - name: Upload artifact
      if: steps.get_version.outputs.is_development == 'false' && steps.check_release.outputs.create_release == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: |
          MAICA_ChatSubmod-${{ steps.get_version.outputs.version }}.zip
          release_notes.md
        retention-days: 30
